<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="auto">

  <style>
    .ink { stroke: #1f1830; }
    .ink-fill { fill: #1f1830; }
    .muted { fill: #62597a; stroke: #62597a; }
    .accent { stroke: #4b2a7b; }
    .accent-fill { fill: #4b2a7b; }
    .soft-fill { fill: #ece7f4; }
    .alt-fill { fill: #d8cceb; }
    .plane-fill { fill: rgba(123, 94, 167, 0.14); stroke: #4b2a7b; }
    .plane-dashed { stroke: #4b2a7b; stroke-dasharray: 5 4; }
    .txt-main { font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1f1830; }
    .txt-sub { font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #62597a; }
    .txt-badge { font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 14px; font-weight: 700; fill: #4b2a7b; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e8e2f2; }
      .ink-fill { fill: #e8e2f2; }
      .muted { fill: #a89fc0; stroke: #a89fc0; }
      .accent { stroke: #b79df0; }
      .accent-fill { fill: #b79df0; }
      .soft-fill { fill: #261d3d; }
      .alt-fill { fill: #362857; }
      .plane-fill { fill: rgba(183, 157, 240, 0.16); stroke: #b79df0; }
      .plane-dashed { stroke: #b79df0; }
      .txt-main { fill: #e8e2f2; }
      .txt-sub { fill: #a89fc0; }
      .txt-badge { fill: #b79df0; }
    }
  </style>

  <!-- (A) Biradial symmetry (Sea anemone / Ctenophore) -->
  <g transform="translate(20, 18)">
    <text x="170" y="16" text-anchor="middle" class="txt-badge">(A) Simetría birradial (2 planos)</text>
    <g transform="translate(170, 130)">
      <!-- Oral disc -->
      <ellipse cx="0" cy="0" rx="76" ry="58" class="soft-fill ink" stroke-width="1.8"/>
      <!-- Opposite tufts -->
      <ellipse cx="-52" cy="0" rx="14" ry="18" class="alt-fill ink" stroke-width="1.5"/>
      <ellipse cx="52" cy="0" rx="14" ry="18" class="alt-fill ink" stroke-width="1.5"/>
      <!-- Slit-like pharynx -->
      <rect x="-24" y="-6" width="48" height="12" rx="6" class="alt-fill ink" stroke-width="1.6"/>
      <!-- 2 orthogonal symmetry planes -->
      <line x1="-102" y1="0" x2="102" y2="0" class="plane-dashed" stroke-width="1.7"/>
      <line x1="0" y1="-80" x2="0" y2="80" class="plane-dashed" stroke-width="1.7"/>
      <!-- Positioned cleanly outside the right oval edge -->
      <text x="108" y="4" text-anchor="start" class="txt-sub">Plano tentacular</text>
      <text x="8" y="-68" text-anchor="start" class="txt-sub">Plano estomodeal</text>
    </g>
    <text x="170" y="232" text-anchor="middle" class="txt-sub">Solo dos planos perpendiculares producen mitades iguales</text>
  </g>

  <!-- (B) Quadriradial symmetry (Hydromedusa / Scyphozoa) -->
  <g transform="translate(405, 18)">
    <text x="160" y="16" text-anchor="middle" class="txt-badge">(B) Simetría cuadrirradial (4 planos)</text>
    <g transform="translate(160, 130)">
      <circle cx="0" cy="0" r="74" class="soft-fill ink" stroke-width="1.8"/>
      <line x1="-74" y1="0" x2="74" y2="0" class="ink" stroke-width="1.6"/>
      <line x1="0" y1="-74" x2="0" y2="74" class="ink" stroke-width="1.6"/>
      <ellipse cx="0" cy="-36" rx="10" ry="18" class="alt-fill ink" stroke-width="1.5"/>
      <ellipse cx="0" cy="36" rx="10" ry="18" class="alt-fill ink" stroke-width="1.5"/>
      <ellipse cx="-36" cy="0" rx="18" ry="10" class="alt-fill ink" stroke-width="1.5"/>
      <ellipse cx="36" cy="0" rx="18" ry="10" class="alt-fill ink" stroke-width="1.5"/>
      <polygon points="0,-14 14,0 0,14 -14,0" class="soft-fill ink" stroke-width="1.6"/>
      <line x1="-92" y1="0" x2="92" y2="0" class="plane-dashed" stroke-width="1.5"/>
      <line x1="0" y1="-92" x2="0" y2="92" class="plane-dashed" stroke-width="1.5"/>
      <line x1="-66" y1="-66" x2="66" y2="66" class="plane-dashed" stroke-width="1.5"/>
      <line x1="-66" y1="66" x2="66" y2="-66" class="plane-dashed" stroke-width="1.5"/>
    </g>
    <text x="160" y="232" text-anchor="middle" class="txt-sub">Cuatro planos equidistantes (medusas)</text>
  </g>

  <!-- (C) Pentaradial symmetry (Echinodermata: starfish) -->
  <g transform="translate(20, 268)">
    <text x="170" y="16" text-anchor="middle" class="txt-badge">(C) Simetría pentarradial (5 ejes)</text>
    <g transform="translate(170, 132)">
      <polygon points="0.0,-82.0 17.6,-24.3 78.0,-25.3 28.5,9.3 48.2,66.3 0.0,30.0 -48.2,66.3 -28.5,9.3 -78.0,-25.3 -17.6,-24.3"
               class="soft-fill ink" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="18" class="alt-fill ink" stroke-width="1.4"/>
      <circle cx="13" cy="-9" r="4" class="accent-fill"/>
      <line x1="16" y1="-11" x2="54" y2="-46" class="accent" stroke-width="1.1"/>
      <text x="57" y="-47" class="txt-sub">Madreporito</text>
      <line x1="-0.0" y1="94.0" x2="0.0" y2="-94.0" class="plane-dashed" stroke-width="1.3"/><line x1="-89.4" y1="29.0" x2="89.4" y2="-29.0" class="plane-dashed" stroke-width="1.3"/><line x1="-55.3" y1="-76.0" x2="55.3" y2="76.0" class="plane-dashed" stroke-width="1.3"/><line x1="55.3" y1="-76.0" x2="-55.3" y2="76.0" class="plane-dashed" stroke-width="1.3"/><line x1="89.4" y1="29.0" x2="-89.4" y2="-29.0" class="plane-dashed" stroke-width="1.3"/>
    </g>
    <text x="170" y="234" text-anchor="middle" class="txt-sub">Cinco radios (equinodermos; bilateralidad secundaria)</text>
  </g>

  <!-- (D) Rotational symmetry (Ctenophore 180° rotation) -->
  <g transform="translate(405, 268)">
    <text x="160" y="16" text-anchor="middle" class="txt-badge">(D) Simetría rotacional (giro de 180°)</text>
    <g transform="translate(160, 132)">
      <circle cx="0" cy="0" r="56" class="soft-fill ink" stroke-width="1.8"/>
      <line x1="19.9" y1="9.3" x2="47.1" y2="22.0" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="9.3" y1="19.9" x2="22.0" y2="47.1" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="-9.3" y1="19.9" x2="-22.0" y2="47.1" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="-19.9" y1="9.3" x2="-47.1" y2="22.0" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="-19.9" y1="-9.3" x2="-47.1" y2="-22.0" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="-9.3" y1="-19.9" x2="-22.0" y2="-47.1" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="9.3" y1="-19.9" x2="22.0" y2="-47.1" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/><line x1="19.9" y1="-9.3" x2="47.1" y2="-22.0" class="ink" stroke-width="2.4" stroke-dasharray="2 2"/>
      <circle cx="-44" cy="0" r="10" class="alt-fill ink" stroke-width="1.5"/>
      <path d="M -54 0 C -84 0, -82 -48, -82 -74" fill="none" class="ink" stroke-width="1.8"/>
      <circle cx="44" cy="0" r="10" class="alt-fill ink" stroke-width="1.5"/>
      <path d="M 54 0 C 84 0, 82 48, 82 74" fill="none" class="ink" stroke-width="1.8"/>
      <circle cx="-11" cy="-11" r="3.5" class="accent-fill"/>
      <circle cx="11" cy="11" r="3.5" class="accent-fill"/>
      <ellipse cx="0" cy="0" rx="6" ry="15" class="alt-fill ink" stroke-width="1.4"/>
      <path d="M -26 -68 A 72 72 0 0 1 26 -68" fill="none" class="accent" stroke-width="1.6"/>
      <polygon points="26,-68 18,-72 21,-63" class="accent-fill"/>
      <text x="0" y="-76" text-anchor="middle" class="txt-sub">180°</text>
    </g>
    <text x="160" y="234" text-anchor="middle" class="txt-sub">Idéntico tras rotación de 180° (ctenóforo estilizado)</text>
  </g>
</svg>

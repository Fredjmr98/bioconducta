<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gráfico de Relación Superficie-Volumen S/V = 6V^(-1/3) — Bioprâxis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f7f5f3;
      --ink: #1f1830;
      --muted: #62597a;
      --rule: #dcd6e2;
      --accent: #4b2a7b;
      --accent-soft: #ece7f4;
      --surface: #fbf9f7;
      --box-bg: #ffffff;
      --sans: "Barlow", -apple-system, BlinkMacSystemFont, sans-serif;
      --head: "Barlow Semi Condensed", "Barlow", sans-serif;
      --serif: "Crimson Pro", Georgia, serif;
      --shadow-box: 0 2px 10px rgba(31, 24, 48, 0.14);
    }

    [data-theme="dark"] {
      --bg: #150f22;
      --ink: #e8e2f2;
      --muted: #a89fc0;
      --rule: #2e2540;
      --accent: #b79df0;
      --accent-soft: #221a38;
      --surface: #1a132b;
      --box-bg: #221938;
      --shadow-box: 0 4px 16px rgba(5, 3, 12, 0.55);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #150f22;
        --ink: #e8e2f2;
        --muted: #a89fc0;
        --rule: #2e2540;
        --accent: #b79df0;
        --accent-soft: #221a38;
        --surface: #1a132b;
        --box-bg: #221938;
        --shadow-box: 0 4px 16px rgba(5, 3, 12, 0.55);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget-shell {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 10px 12px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 8px 8px 4px;
      touch-action: pan-y;
    }

    #graph-svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      max-height: 300px;
      cursor: default;
      overflow: visible;
    }

    .axis-line {
      stroke: var(--rule);
      stroke-width: 1.3;
    }

    .grid-line {
      stroke: var(--rule);
      stroke-width: 0.75;
      stroke-dasharray: 2 3;
      opacity: 0.6;
    }

    .tick-text {
      font-family: var(--sans);
      font-size: 10px;
      fill: var(--muted);
      user-select: none;
    }

    .axis-title {
      font-family: var(--head);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      fill: var(--ink);
      user-select: none;
    }

    .axis-title .var-sym {
      font-family: var(--serif);
      font-style: italic;
      font-size: 14.5px;
      font-weight: 600;
      fill: var(--accent);
    }

    .axis-title .unit-sym {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      fill: var(--ink);
    }

    .curve-main {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .curve-const-ref {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.45;
      stroke-dasharray: 1.5 4;
      stroke-linecap: round;
      opacity: 0.78;
    }

    .point-node {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 1.5;
      cursor: pointer;
    }

    .point-node:hover,
    .point-node.selected {
      fill: var(--ink);
    }

    .active-guide {
      stroke: var(--accent);
      stroke-width: 1;
      stroke-dasharray: 2.5 2.5;
      opacity: 0.55;
      pointer-events: none;
    }

    .active-dot {
      fill: var(--accent);
      stroke: var(--bg);
      stroke-width: 2.2;
      cursor: grab;
      touch-action: none;
    }

    .active-dot:hover {
      fill: var(--ink);
    }

    .active-dot.dragging {
      cursor: grabbing;
      fill: var(--ink);
    }

    .active-dot-hit {
      fill: transparent;
      cursor: grab;
      touch-action: none;
    }

    .active-dot-hit.dragging {
      cursor: grabbing;
    }

    /* Desmos-style floating coordinate box (shown only for a few seconds after V changes) */
    .desmos-callout {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate(-50%, calc(-100% - 12px));
      background: var(--box-bg);
      color: var(--ink);
      border: 1px solid var(--rule);
      border-radius: 7px;
      padding: 5px 10px;
      box-shadow: var(--shadow-box);
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.2;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .desmos-callout.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .desmos-callout .paren {
      font-size: 16px;
      font-weight: 400;
      color: var(--muted);
    }

    .desmos-callout .kv {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
    }

    .desmos-callout .sym {
      font-style: italic;
      color: var(--accent);
      font-weight: 600;
    }

    .desmos-callout .eq {
      color: var(--muted);
      font-style: normal;
      font-size: 12px;
    }

    .desmos-callout .num {
      font-family: var(--head);
      font-style: normal;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .desmos-callout .sep-comma {
      color: var(--muted);
      font-style: normal;
      margin: 0 1px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 0 2px;
    }

    .slider-row label {
      font-family: var(--serif);
      font-style: italic;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      background: var(--rule);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
    }

    @media (max-width: 560px) {
      body {
        padding: 6px;
      }

      .widget-shell {
        padding: 8px 9px;
      }

      #graph-svg {
        aspect-ratio: 4 / 3;
        max-height: 245px;
      }

      .axis-title {
        font-size: 11.5px;
      }

      .axis-title .var-sym {
        font-size: 13px;
      }

      .axis-title .unit-sym {
        font-size: 10.5px;
      }

      .desmos-callout {
        padding: 4px 8px;
        font-size: 12.5px;
        gap: 4px;
      }

      .desmos-callout .num {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="widget-shell" aria-label="Gráfico de relación superficie-volumen S/V = 6V^(-1/3)">
    <section class="chart-wrap" id="chart-wrap">
      <div class="desmos-callout" id="desmos-callout" aria-live="polite">
        <span class="paren">(</span>
        <span class="kv"><span class="sym">V</span><span class="eq">=</span><span class="num" id="val-v">8.0</span></span>
        <span class="sep-comma">,</span>
        <span class="kv"><span class="sym">S/V</span><span class="eq">=</span><span class="num" id="val-sv">3</span></span>
        <span class="paren">)</span>
      </div>

      <svg id="graph-svg" viewBox="0 0 640 370" role="img" aria-label="Gráfica de S/V = 6V^(-1/3) en función del volumen V">
        <g id="grid-layer"></g>
        <g id="axes-layer">
          <!-- Vertical (S/V) and Horizontal (V) axes -->
          <line id="axis-y" class="axis-line" x1="72" y1="22" x2="72" y2="314" />
          <line id="axis-x" class="axis-line" x1="72" y1="314" x2="620" y2="314" />

          <!-- Centered, conspicuous axis titles -->
          <text id="title-y" class="axis-title" x="18" y="168" text-anchor="middle" transform="rotate(-90 18 168)">
            <tspan class="var-sym">S/V</tspan> <tspan class="unit-sym">(u<tspan dy="-4" font-size="9.5">−1</tspan><tspan dy="4">)</tspan></tspan>
          </text>

          <text id="title-x" class="axis-title" x="346" y="354" text-anchor="middle">
            <tspan class="var-sym">V</tspan> <tspan class="unit-sym">(u<tspan dy="-4" font-size="9.5">3</tspan><tspan dy="4">)</tspan></tspan>
          </text>
        </g>

        <g id="curves-layer">
          <!-- Dotted constant-ratio reference line: S/V = 3 (if S grew linearly with V, S/V would stay constant) -->
          <line id="const-ref-line" class="curve-const-ref" x1="72" y1="241" x2="620" y2="241" />

          <!-- Main curve S/V = 6 * V^(-1/3) -->
          <path id="main-path" class="curve-main" />
        </g>

        <g id="sample-points-layer"></g>

        <g id="indicator-layer">
          <line id="guide-v" class="active-guide" x1="72" y1="22" x2="72" y2="314" />
          <line id="guide-y" class="active-guide" x1="72" y1="314" x2="620" y2="314" />
          <circle id="active-dot" class="active-dot" cx="72" cy="314" r="5.5" />
          <circle id="active-dot-hit" class="active-dot-hit" cx="72" cy="314" r="15" />
        </g>
      </svg>
    </section>

    <div class="slider-row">
      <label for="v-slider">V</label>
      <input id="v-slider" type="range" min="0.2" max="16" step="0.1" value="8.0" aria-label="Volumen V" />
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const CALLOUT_VISIBLE_MS = 2600;

      function readStoredTheme() {
        try {
          return window.localStorage.getItem("theme");
        } catch (err) {
          return null;
        }
      }

      function writeStoredTheme(theme) {
        try {
          window.localStorage.setItem("theme", theme);
        } catch (err) {}
      }

      const initialStored = readStoredTheme();
      if (initialStored === "dark" || initialStored === "light") {
        document.documentElement.setAttribute("data-theme", initialStored);
      }

      window.addEventListener("message", function (event) {
        const data = event.data || {};
        if (data.type === "bioprax-theme") {
          document.documentElement.setAttribute("data-theme", data.dark ? "dark" : "light");
          writeStoredTheme(data.dark ? "dark" : "light");
          positionCallout(currentV, svRatioFromV(currentV));
        }
      });

      window.addEventListener("storage", function (event) {
        if (event.key === "theme" && (event.newValue === "dark" || event.newValue === "light")) {
          document.documentElement.setAttribute("data-theme", event.newValue);
          positionCallout(currentV, svRatioFromV(currentV));
        }
      });

      const chartWrap = document.getElementById("chart-wrap");
      const svg = document.getElementById("graph-svg");
      const gridLayer = document.getElementById("grid-layer");
      const samplePointsLayer = document.getElementById("sample-points-layer");
      const mainPath = document.getElementById("main-path");
      const constRefLine = document.getElementById("const-ref-line");

      const guideV = document.getElementById("guide-v");
      const guideY = document.getElementById("guide-y");
      const activeDot = document.getElementById("active-dot");
      const activeDotHit = document.getElementById("active-dot-hit");

      const callout = document.getElementById("desmos-callout");
      const vSlider = document.getElementById("v-slider");
      const valV = document.getElementById("val-v");
      const valSV = document.getElementById("val-sv");

      // At V = 0.2, S/V = 6 / cbrt(0.2) ≈ 10.26, so yMax = 12 cleanly contains [0.2, 16]
      const PLOT = {
        left: 72,
        right: 620,
        top: 22,
        bottom: 314,
        vMin: 0,
        vMax: 16,
        yMin: 0,
        yMax: 12
      };

      const plotWidth = PLOT.right - PLOT.left;
      const plotHeight = PLOT.bottom - PLOT.top;

      function xFromV(v) {
        const clamped = Math.max(PLOT.vMin, Math.min(PLOT.vMax, v));
        return PLOT.left + ((clamped - PLOT.vMin) / (PLOT.vMax - PLOT.vMin)) * plotWidth;
      }

      function vFromX(x) {
        const ratio = (x - PLOT.left) / plotWidth;
        const clampedRatio = Math.max(0, Math.min(1, ratio));
        return PLOT.vMin + clampedRatio * (PLOT.vMax - PLOT.vMin);
      }

      function yFromVal(val) {
        const clamped = Math.max(PLOT.yMin, Math.min(PLOT.yMax, val));
        return PLOT.bottom - ((clamped - PLOT.yMin) / (PLOT.yMax - PLOT.yMin)) * plotHeight;
      }

      // Equation 19 for a cube (k = 6): S/V = 6 * V^(-1/3)
      function svRatioFromV(v) {
        return 6 / Math.cbrt(Math.max(0.001, v));
      }

      function buildAxesAndGrid() {
        gridLayer.innerHTML = "";

        [0, 2, 4, 6, 8, 10, 12, 14, 16].forEach(function (vt) {
          const px = xFromV(vt);
          if (vt > 0) {
            const gLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            gLine.setAttribute("class", "grid-line");
            gLine.setAttribute("x1", px.toFixed(1));
            gLine.setAttribute("y1", PLOT.top);
            gLine.setAttribute("x2", px.toFixed(1));
            gLine.setAttribute("y2", PLOT.bottom);
            gridLayer.appendChild(gLine);
          }

          const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          lbl.setAttribute("class", "tick-text");
          lbl.setAttribute("x", px.toFixed(1));
          lbl.setAttribute("y", (PLOT.bottom + 14).toString());
          lbl.setAttribute("text-anchor", "middle");
          lbl.textContent = vt.toString();
          gridLayer.appendChild(lbl);
        });

        [0, 2, 4, 6, 8, 10, 12].forEach(function (yt) {
          const py = yFromVal(yt);
          if (yt > 0) {
            const gLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            gLine.setAttribute("class", "grid-line");
            gLine.setAttribute("x1", PLOT.left);
            gLine.setAttribute("y1", py.toFixed(1));
            gLine.setAttribute("x2", PLOT.right);
            gLine.setAttribute("y2", py.toFixed(1));
            gridLayer.appendChild(gLine);
          }

          const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          lbl.setAttribute("class", "tick-text");
          lbl.setAttribute("x", (PLOT.left - 8).toString());
          lbl.setAttribute("y", (py + 3.5).toString());
          lbl.setAttribute("text-anchor", "end");
          lbl.textContent = yt.toString();
          gridLayer.appendChild(lbl);
        });
      }

      function buildCurves() {
        // Start curve cleanly at top edge where S/V = 12 -> V_start = (6 / 12)^3 = 0.125
        const vStart = Math.pow(6 / PLOT.yMax, 3);
        const samples = 220;
        let dMain = "";
        for (let i = 0; i <= samples; i++) {
          const t = i / samples;
          const v = vStart + (PLOT.vMax - vStart) * (t * t);
          const px = xFromV(v);
          const py = yFromVal(svRatioFromV(v));
          dMain += (i === 0 ? "M " : " L ") + px.toFixed(1) + " " + py.toFixed(1);
        }
        mainPath.setAttribute("d", dMain);

        // Dotted reference line at S/V = 3 (constant ratio if S scaled linearly as 3V, intersecting at V = 8)
        const refY = yFromVal(3);
        constRefLine.setAttribute("x1", PLOT.left.toFixed(1));
        constRefLine.setAttribute("y1", refY.toFixed(1));
        constRefLine.setAttribute("x2", PLOT.right.toFixed(1));
        constRefLine.setAttribute("y2", refY.toFixed(1));
      }

      // Notable integer-edge cube points: L = 1 -> V = 1, S/V = 6; L = 2 -> V = 8, S/V = 3
      const notableVolumes = [1, 8];
      const pointElements = [];

      function buildNotablePoints() {
        samplePointsLayer.innerHTML = "";
        pointElements.length = 0;

        notableVolumes.forEach(function (vVal) {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("class", "point-node");
          circle.setAttribute("cx", xFromV(vVal).toFixed(1));
          circle.setAttribute("cy", yFromVal(svRatioFromV(vVal)).toFixed(1));
          circle.setAttribute("r", "3.6");

          circle.addEventListener("pointerdown", function (ev) {
            ev.stopPropagation();
            setInspectedVolume(vVal, true);
            startDotDrag(ev);
          });

          samplePointsLayer.appendChild(circle);
          pointElements.push({ v: vVal, el: circle });
        });
      }

      let currentV = 8.0;
      let isDraggingDot = false;
      let hideCalloutTimer = null;

      function formatRatio(num) {
        if (Math.abs(num - Math.round(num)) < 0.015) {
          return Math.round(num).toString();
        }
        return num.toFixed(2);
      }

      function positionCallout(v, sv) {
        const svgRect = svg.getBoundingClientRect();
        const wrapRect = chartWrap.getBoundingClientRect();
        if (!svgRect.width || !svgRect.height || !wrapRect.width) return;

        const vx = xFromV(v);
        const vy = yFromVal(sv);

        const dotClientX = svgRect.left + (vx / 640) * svgRect.width;
        const dotClientY = svgRect.top + (vy / 370) * svgRect.height;

        const relX = dotClientX - wrapRect.left;
        const relY = dotClientY - wrapRect.top;

        const boxW = callout.offsetWidth || 125;
        const boxH = callout.offsetHeight || 30;
        const marginX = 8;

        const placeBelow = relY - boxH - 14 < 6;
        const clampedX = Math.max(marginX + boxW / 2, Math.min(wrapRect.width - marginX - boxW / 2, relX));
        const clampedY = placeBelow
          ? Math.min(wrapRect.height - boxH - 8, relY + 12)
          : Math.max(boxH + 12, relY - 12);

        callout.style.left = clampedX.toFixed(1) + "px";
        callout.style.top = clampedY.toFixed(1) + "px";
        callout.style.transform = placeBelow ? "translate(-50%, 0)" : "translate(-50%, -100%)";
      }

      function scheduleCalloutHide(delayMs) {
        if (hideCalloutTimer !== null) {
          window.clearTimeout(hideCalloutTimer);
          hideCalloutTimer = null;
        }
        if (isDraggingDot) return;
        hideCalloutTimer = window.setTimeout(function () {
          callout.classList.remove("is-visible");
          hideCalloutTimer = null;
        }, delayMs);
      }

      function revealCalloutTemporarily() {
        callout.classList.add("is-visible");
        scheduleCalloutHide(CALLOUT_VISIBLE_MS);
      }

      function setInspectedVolume(v, showBox) {
        const clamped = Math.max(0.2, Math.min(PLOT.vMax, Math.round(v * 10) / 10));
        const changed = Math.abs(clamped - currentV) > 1e-6;
        currentV = clamped;
        const sv = svRatioFromV(currentV);

        vSlider.value = currentV.toFixed(1);
        valV.textContent = currentV.toFixed(1);
        valSV.textContent = formatRatio(sv);

        const px = xFromV(currentV);
        const py = yFromVal(sv);

        guideV.setAttribute("x1", px.toFixed(1));
        guideV.setAttribute("x2", px.toFixed(1));
        guideV.setAttribute("y1", PLOT.top);
        guideV.setAttribute("y2", PLOT.bottom);

        guideY.setAttribute("x1", PLOT.left);
        guideY.setAttribute("x2", px.toFixed(1));
        guideY.setAttribute("y1", py.toFixed(1));
        guideY.setAttribute("y2", py.toFixed(1));

        activeDot.setAttribute("cx", px.toFixed(1));
        activeDot.setAttribute("cy", py.toFixed(1));
        activeDotHit.setAttribute("cx", px.toFixed(1));
        activeDotHit.setAttribute("cy", py.toFixed(1));

        pointElements.forEach(function (pt) {
          pt.el.classList.toggle("selected", Math.abs(pt.v - currentV) < 0.06);
        });

        positionCallout(currentV, sv);

        if (showBox && changed) {
          revealCalloutTemporarily();
        }
      }

      function clientXToVolume(clientX) {
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return currentV;
        const viewBoxX = ((clientX - rect.left) / rect.width) * 640;
        return vFromX(viewBoxX);
      }

      function startDotDrag(ev) {
        isDraggingDot = true;
        if (hideCalloutTimer !== null) {
          window.clearTimeout(hideCalloutTimer);
          hideCalloutTimer = null;
        }
        callout.classList.add("is-visible");
        activeDot.classList.add("dragging");
        activeDotHit.classList.add("dragging");
        try {
          activeDotHit.setPointerCapture(ev.pointerId);
        } catch (err) {}
      }

      function moveDotDrag(ev) {
        if (!isDraggingDot) return;
        setInspectedVolume(clientXToVolume(ev.clientX), true);
      }

      function stopDotDrag(ev) {
        if (!isDraggingDot) return;
        isDraggingDot = false;
        activeDot.classList.remove("dragging");
        activeDotHit.classList.remove("dragging");
        if (ev && ev.pointerId !== undefined) {
          try {
            activeDotHit.releasePointerCapture(ev.pointerId);
          } catch (err) {}
        }
        scheduleCalloutHide(CALLOUT_VISIBLE_MS);
      }

      activeDotHit.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        startDotDrag(ev);
      });

      activeDotHit.addEventListener("pointermove", moveDotDrag);
      activeDotHit.addEventListener("pointerup", stopDotDrag);
      activeDotHit.addEventListener("pointercancel", stopDotDrag);

      window.addEventListener("pointermove", moveDotDrag);
      window.addEventListener("pointerup", stopDotDrag);
      window.addEventListener("pointercancel", stopDotDrag);

      vSlider.addEventListener("input", function (ev) {
        setInspectedVolume(parseFloat(ev.target.value), true);
      });

      window.addEventListener("resize", function () {
        positionCallout(currentV, svRatioFromV(currentV));
      });

      buildAxesAndGrid();
      buildCurves();
      buildNotablePoints();
      setInspectedVolume(8.0, false);
    })();
  </script>
</body>
</html>
